<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>hold-dictate settings</title>
<style>
:root { --bg:#fff; --fg:#171717; --muted:#666; --line:#ebebeb; --card:#fafafa; --ok:#16794a; --bad:#c62828; --accent:#171717; --on:#fff; }
@media (prefers-color-scheme: dark) {
  :root { --bg:#000; --fg:#ededed; --muted:#a1a1a1; --line:#242424; --card:#0a0a0a; --ok:#4cc38a; --bad:#ff6b6b; --accent:#ededed; --on:#000; }
}
* { box-sizing:border-box; }
body { margin:0; background:var(--bg); color:var(--fg); font:15px/1.55 Inter,system-ui,-apple-system,"Segoe UI",Roboto,Heebo,Arial,"Noto Sans","Noto Sans Hebrew",sans-serif; -webkit-font-smoothing:antialiased; }
main { max-width:680px; margin:0 auto; padding:32px 24px 96px; }
header { display:flex; justify-content:space-between; align-items:baseline; margin-bottom:28px; }
header b { font-size:17px; font-weight:600; letter-spacing:-.01em; }
header span { color:var(--muted); font-size:13px; }
header button { font:inherit; font-size:13px; color:var(--muted); background:none; border:0; cursor:pointer; padding:0; margin-inline-start:12px; }
header button:hover { color:var(--fg); }
.banner { border:1px solid var(--line); background:var(--card); border-radius:10px; padding:14px 16px; margin-bottom:24px; display:flex; gap:12px; align-items:center; justify-content:space-between; }
.banner[hidden] { display:none; }
section { border-top:1px solid var(--line); padding:24px 0; display:grid; grid-template-columns:160px 1fr; gap:8px 24px; }
section > h2 { font-size:13px; font-weight:500; color:var(--muted); margin:3px 0 0; }
.rows { display:grid; gap:18px; min-width:0; }
label.f { display:grid; gap:6px; font-size:14px; font-weight:500; }
.hint { font-size:13px; color:var(--muted); font-weight:400; margin:0; }
input[type=text], input[type=password], input[type=number], select { font:inherit; font-size:14px; width:100%; padding:8px 10px; border-radius:8px; border:1px solid var(--line); background:var(--bg); color:var(--fg); }
input:focus-visible, select:focus-visible, button:focus-visible { outline:2px solid var(--fg); outline-offset:1px; }
input.ltr { direction:ltr; text-align:left; font-family:ui-monospace,Menlo,Consolas,monospace; }
.line { display:flex; gap:8px; align-items:center; }
.line > input { flex:1; }
button.b { font:inherit; font-size:14px; padding:8px 14px; border-radius:8px; border:1px solid var(--line); background:var(--bg); color:var(--fg); cursor:pointer; white-space:nowrap; }
button.b:hover { background:var(--card); }
button.p { background:var(--accent); color:var(--on); border-color:var(--accent); }
button.p:hover { background:var(--accent); opacity:.88; }
button:disabled { opacity:.5; cursor:default; }
.seg { display:flex; flex-wrap:wrap; gap:6px; }
.seg button { font:inherit; font-size:14px; padding:7px 12px; border-radius:8px; border:1px solid var(--line); background:var(--bg); color:var(--fg); cursor:pointer; }
.seg button[aria-pressed=true] { background:var(--accent); color:var(--on); border-color:var(--accent); }
.switch { display:flex; justify-content:space-between; align-items:center; gap:16px; font-size:14px; font-weight:500; cursor:pointer; }
.switch input { appearance:none; width:36px; height:20px; border-radius:10px; background:var(--line); position:relative; cursor:pointer; flex:none; margin:0; }
.switch input::after { content:""; position:absolute; top:2px; inset-inline-start:2px; width:16px; height:16px; border-radius:50%; background:#fff; box-shadow:0 1px 2px rgba(0,0,0,.2); }
.switch input:checked { background:var(--accent); }
.switch input:checked::after { inset-inline-start:18px; }
.ready .switch input { transition:background .15s; } .ready .switch input::after { transition:inset-inline-start .15s; }
.msg:empty { display:none; }
.switch input:disabled { opacity:.5; cursor:default; }
.kbd { font:13px ui-monospace,Menlo,Consolas,monospace; padding:7px 12px; border-radius:8px; border:1px solid var(--line); border-bottom-width:2px; background:var(--card); direction:ltr; min-width:120px; text-align:center; }
.kbd.rec { border-color:var(--fg); }
.msg { font-size:13px; margin:0; min-height:1em; }
.msg.ok { color:var(--ok); } .msg.bad { color:var(--bad); }
.stage { border:1px solid var(--line); border-radius:10px; background:var(--card); height:150px; position:relative; overflow:hidden; }
.pill { position:absolute; left:50%; display:grid; place-items:center; width:224px; height:56px; border-radius:28px; border:1px solid #2a2a2e; transform:translateX(-50%) scale(var(--s,1)); transition:top .2s, bottom .2s; }
.pill canvas { display:block; width:192px; height:40px; }
.colors { display:flex; gap:16px; flex-wrap:wrap; }
.colors label { display:flex; gap:8px; align-items:center; font-size:14px; }
input[type=color] { width:36px; height:28px; border:1px solid var(--line); border-radius:6px; background:none; padding:2px; cursor:pointer; }
input[type=range] { width:100%; accent-color:var(--fg); }
details summary { cursor:pointer; font-size:14px; color:var(--muted); }
details[open] summary { margin-bottom:14px; }
.toast { position:fixed; bottom:20px; left:50%; transform:translate(-50%, 12px); background:var(--accent); color:var(--on); font-size:13px; padding:8px 14px; border-radius:8px; opacity:0; transition:opacity .15s, transform .15s; pointer-events:none; }
.toast.on { opacity:1; transform:translate(-50%, 0); }
.toast.bad { background:var(--bad); color:#fff; }
[hidden] { display:none !important; }
@media (max-width:620px) { section { grid-template-columns:1fr; } }
</style>
</head>
<body>
<main>
<header><b>hold-dictate</b><span><span id="ver"></span><button id="lang" type="button"></button></span></header>

<div class="banner" id="notRunning" hidden><span data-t="notRunning"></span><button class="b p" id="startSvc" data-t="start"></button></div>
<div class="banner" id="problem" hidden><span id="problemText"></span></div>
<div class="banner" id="noKey" hidden><span data-t="noKey"></span></div>

<section>
  <h2 data-t="service"></h2>
  <div class="rows">
    <div class="seg" id="provider"></div>
    <div class="rows" id="keyRows">
      <label class="f"><span data-t="apiKey"></span>
        <span class="line"><input type="password" id="key" class="ltr" autocomplete="off" spellcheck="false"><button class="b p" id="saveKey" data-t="saveKey"></button></span>
      </label>
      <p class="msg" id="keyMsg"></p>
      <p class="hint" id="keyHelp"></p>
    </div>
    <div class="rows" id="customRows">
      <label class="f"><span data-t="baseUrl"></span><input type="text" id="base_url" class="ltr" placeholder="https://host/v1"></label>
      <label class="f"><span data-t="model"></span><input type="text" id="model" class="ltr"></label>
    </div>
    <p class="hint" id="localHelp"></p>
  </div>
</section>

<section>
  <h2 data-t="speaking"></h2>
  <div class="rows">
    <label class="f"><span data-t="language"></span>
      <select id="language">
        <option value="" data-t="auto"></option>
        <option value="he" data-t="he"></option>
        <option value="en">English</option>
        <option value="ar">العربية</option>
        <option value="ru">Русский</option>
        <option value="es">Español</option>
        <option value="fr">Français</option>
        <option value="de">Deutsch</option>
      </select>
    </label>
    <div class="f"><span data-t="hotkey"></span>
      <span class="line"><span class="kbd" id="hotkey"></span><button class="b" id="recKey" data-t="change"></button></span>
      <p class="msg" id="hotkeyMsg"></p>
    </div>
    <label class="switch"><span data-t="sounds"></span><input type="checkbox" id="sounds"></label>
  </div>
</section>

<section>
  <h2 data-t="look"></h2>
  <div class="rows">
    <div class="stage" id="stage"><div class="pill" id="pill"></div></div>
    <div class="colors">
      <label><input type="color" id="overlay_bg"><span data-t="bg"></span></label>
      <label><input type="color" id="overlay_bars"><span data-t="bars"></span></label>
      <button class="b" id="resetLook" data-t="reset"></button>
    </div>
    <div class="f"><span data-t="position"></span>
      <div class="seg" id="overlay_position"><button data-v="bottom" data-t="bottom"></button><button data-v="top" data-t="top"></button></div>
    </div>
    <label class="f"><span data-t="size"></span><input type="range" id="overlay_size" min="0.75" max="1.5" step="0.05"></label>
    <p class="hint" id="lookHint" data-t="lookHint"></p>
  </div>
</section>

<section>
  <h2 data-t="updates"></h2>
  <div class="rows">
    <label class="switch"><span data-t="autoUpdate"></span><input type="checkbox" id="auto_update"></label>
    <div class="line"><button class="b" id="checkUpd" data-t="check"></button><button class="b p" id="installUpd" data-t="install" hidden></button></div>
    <p class="msg" id="updMsg"></p>
  </div>
</section>

<section>
  <h2 data-t="advanced"></h2>
  <div class="rows">
    <details><summary data-t="more"></summary>
      <div class="rows">
        <label class="switch"><span data-t="fallback"></span><input type="checkbox" id="local_fallback"></label>
        <label class="f"><span data-t="minHold"></span><input type="number" id="min_hold" min="0" max="2" step="0.05"></label>
        <label class="f"><span data-t="timeout"></span><input type="number" id="timeout" min="3" max="120" step="1"></label>
        <label class="f"><span data-t="prompt"></span><input type="text" id="prompt"><span class="hint" data-t="promptHint"></span></label>
        <p class="hint"><span data-t="file"></span> <code id="cfgPath" class="ltr"></code></p>
      </div>
    </details>
  </div>
</section>
</main>
<div class="toast" id="toast"></div>

<script>
const TOKEN = new URLSearchParams(location.search).get('t') || '';
history.replaceState(null, '', '/?t=' + encodeURIComponent(TOKEN));
const $ = id => document.getElementById(id);

const T = {
  en: {
    other: 'עברית', notRunning: 'hold-dictate is not running, so the hotkey does nothing yet.', start: 'Start it',
    noKey: 'Add an API key below to start dictating.',
    service: 'Speech service', apiKey: 'API key', saveKey: 'Save', saved: 'Saved', keyOk: 'Key works and is saved.',
    keySaved: 'Saved key', keyEnv: 'A key is set in an environment variable.',
    getKey: 'Get a free key at', getKeySteps: 'Sign in, click Create API Key, copy it and paste it here. It is stored only on this computer.',
    baseUrl: 'Server base URL', model: 'Model (empty = default)',
    localOk: 'Runs offline on this computer. The first use downloads the model.',
    localMissing: 'Local mode needs an extra install. In a terminal run: uv tool install --force "hold-dictate[local]"',
    speaking: 'Speaking', language: 'Language', auto: 'Detect automatically', he: 'Hebrew (with English words)',
    hotkey: 'Hold-to-talk hotkey', change: 'Change', press: 'Press the keys…', hotkeyHint: 'Use a modifier (Alt, Ctrl, Shift, Win/Cmd) plus a letter, digit, Space or F-key. Esc cancels.',
    sounds: 'Play short sounds when recording starts and stops',
    look: 'Recording pill', bg: 'Background', bars: 'Bars', reset: 'Reset', position: 'Position', bottom: 'Bottom', top: 'Top', size: 'Size',
    lookHint: 'The pill shows on Linux (Wayland with quickshell). Windows and macOS use the sounds for now.',
    updates: 'Updates', autoUpdate: 'Install updates automatically', check: 'Check now', install: 'Update now',
    upToDate: 'You have the latest version.', availableV: v => `Version ${v} is available.`, installing: 'Installing in the background. hold-dictate restarts when it is done.',
    noAuto: r => `Automatic updates are off here: ${r}.`,
    advanced: 'Advanced', more: 'More settings', fallback: 'Use the local model if the cloud request fails (when installed)',
    minHold: 'Ignore taps shorter than (seconds)', timeout: 'Give up on a cloud request after (seconds)',
    prompt: 'Spelling hint', promptHint: 'Words and names the transcriber should spell your way.', file: 'Settings file:',
    error: 'Could not save',
  },
  he: {
    other: 'English', notRunning: 'hold-dictate לא פועל כרגע, ולכן קיצור המקלדת עוד לא עושה כלום.', start: 'הפעל',
    noKey: 'כדי להתחיל להכתיב, הכניסו API key למטה.',
    service: 'שירות תמלול', apiKey: 'API key', saveKey: 'שמירה', saved: 'נשמר', keyOk: 'המפתח עובד ונשמר.',
    keySaved: 'מפתח שמור', keyEnv: 'מוגדר מפתח במשתנה סביבה.',
    getKey: 'מפתח חינמי אפשר לקבל ב-', getKeySteps: 'נכנסים, לוחצים Create API Key, מעתיקים ומדביקים כאן. המפתח נשמר רק במחשב הזה.',
    baseUrl: 'כתובת השרת', model: 'מודל (ריק = ברירת מחדל)',
    localOk: 'רץ במחשב בלי אינטרנט. בשימוש הראשון המודל יורד.',
    localMissing: 'מצב מקומי דורש התקנה נוספת. בטרמינל: uv tool install --force "hold-dictate[local]"',
    speaking: 'דיבור', language: 'שפה', auto: 'זיהוי אוטומטי', he: 'עברית (עם מילים באנגלית)',
    hotkey: 'קיצור מקלדת (מחזיקים ומדברים)', change: 'שינוי', press: 'לחצו על המקשים…', hotkeyHint: 'מקש בקרה (Alt, Ctrl, Shift, Win/Cmd) ועוד אות, ספרה, רווח או F. ‏Esc מבטל.',
    sounds: 'צליל קצר בתחילת ההקלטה ובסופה',
    look: 'חלון ההקלטה', bg: 'רקע', bars: 'פסים', reset: 'איפוס', position: 'מיקום', bottom: 'למטה', top: 'למעלה', size: 'גודל',
    lookHint: 'החלון מוצג בלינוקס (Wayland עם quickshell). ב-Windows וב-macOS יש בינתיים צלילים.',
    updates: 'עדכונים', autoUpdate: 'להתקין עדכונים אוטומטית', check: 'בדיקה עכשיו', install: 'לעדכן עכשיו',
    upToDate: 'יש לכם את הגרסה האחרונה.', availableV: v => `גרסה ${v} זמינה.`, installing: 'מתקין ברקע. hold-dictate יופעל מחדש בסיום.',
    noAuto: r => `עדכון אוטומטי לא זמין כאן: ${r}.`,
    advanced: 'מתקדם', more: 'הגדרות נוספות', fallback: 'להשתמש במודל המקומי אם הבקשה לענן נכשלת (אם מותקן)',
    minHold: 'להתעלם מלחיצות קצרות מ- (שניות)', timeout: 'לוותר על בקשה לענן אחרי (שניות)',
    prompt: 'רמז לאיות', promptHint: 'מילים ושמות שהתמלול צריך לאיית כמו שאתם כותבים אותם.', file: 'קובץ ההגדרות:',
    error: 'השמירה נכשלה',
  },
};
let L = localStorage.lang || (navigator.language.startsWith('he') ? 'he' : 'en');
const t = k => T[L][k];
let S = /*STATE*/null; // last state from the server, filled in when the page is served

function applyLang() {
  document.documentElement.lang = L;
  document.documentElement.dir = L === 'he' ? 'rtl' : 'ltr';
  document.querySelectorAll('[data-t]').forEach(el => { el.textContent = t(el.dataset.t); });
  $('lang').textContent = t('other');
  if (S) render(S);
}
$('lang').onclick = () => { L = localStorage.lang = L === 'he' ? 'en' : 'he'; applyLang(); };

async function api(path, body) {
  const res = await fetch(path, { method: body === undefined ? 'GET' : 'POST', headers: { 'X-Token': TOKEN, 'Content-Type': 'application/json' }, body: body === undefined ? undefined : JSON.stringify(body) });
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || res.statusText);
  return data;
}

let toastTimer;
function toast(text, bad) {
  const el = $('toast'); el.textContent = text; el.classList.toggle('bad', !!bad); el.classList.add('on');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove('on'), 1800);
}

async function save(changes) {
  try { S = await api('/api/config', changes); render(S); toast(t('saved')); }
  catch (e) { toast(`${t('error')}: ${e.message}`, true); render(S); }
}

function render(s) {
  const c = s.config;
  $('ver').textContent = 'v' + s.version + ' · ';
  $('notRunning').hidden = s.running;
  $('problem').hidden = !s.problem;
  $('problemText').textContent = s.problem;
  $('noKey').hidden = c.provider === 'local' || !!s.key_hint || s.key_from_env;
  const prov = $('provider');
  prov.innerHTML = '';
  for (const [k, v] of [...Object.entries(s.providers), ['local', { label: L === 'he' ? 'מקומי (בלי אינטרנט)' : 'Local (offline)' }]]) {
    const b = document.createElement('button');
    b.type = 'button'; b.textContent = v.label.replace(/ \(.*/, ''); b.setAttribute('aria-pressed', String(c.provider === k));
    b.onclick = () => c.provider !== k && save({ provider: k });
    prov.append(b);
  }
  const local = c.provider === 'local', p = s.providers[c.provider];
  $('keyRows').hidden = local;
  $('customRows').hidden = c.provider !== 'custom';
  $('localHelp').hidden = !local;
  $('localHelp').textContent = s.local_installed ? t('localOk') : t('localMissing');
  $('key').placeholder = s.key_hint ? `${t('keySaved')} ${s.key_hint}` : (s.key_from_env ? t('keyEnv') : '');
  const help = $('keyHelp'); help.textContent = '';
  if (p && p.keys_url) {
    help.append(t('getKey') + ' ');
    const a = document.createElement('a'); a.href = p.keys_url; a.target = '_blank'; a.rel = 'noopener'; a.textContent = new URL(p.keys_url).host; a.style.color = 'inherit';
    help.append(a, '. ' + t('getKeySteps'));
  }
  if (document.activeElement !== $('base_url')) $('base_url').value = c.base_url;
  if (document.activeElement !== $('model')) { $('model').value = c.model; $('model').placeholder = p ? p.model : ''; }
  $('language').value = c.language;
  if (![...$('language').options].some(o => o.value === c.language)) { const o = new Option(c.language, c.language); $('language').add(o); $('language').value = c.language; }
  if (!recording) $('hotkey').textContent = pretty(c.hotkey);
  $('sounds').checked = c.sounds;
  $('overlay_bg').value = c.overlay_bg; $('overlay_bars').value = c.overlay_bars;
  document.querySelectorAll('#overlay_position button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.v === c.overlay_position)));
  $('overlay_size').value = c.overlay_size;
  $('lookHint').hidden = s.overlay;
  $('auto_update').checked = c.auto_update;
  const u = s.update, msg = $('updMsg');
  $('installUpd').hidden = !u.available || !!u.can_update;
  $('auto_update').disabled = !!u.can_update;
  msg.className = 'msg';
  msg.textContent = u.can_update ? t('noAuto')(u.can_update) : u.available ? t('availableV')(u.latest) + (u.status && !u.status.endsWith('available') ? ' ' + u.status : '') : u.latest ? t('upToDate') : u.status;
  $('local_fallback').checked = c.local_fallback;
  if (document.activeElement !== $('min_hold')) $('min_hold').value = c.min_hold;
  if (document.activeElement !== $('timeout')) $('timeout').value = c.timeout;
  if (document.activeElement !== $('prompt')) $('prompt').value = c.prompt;
  $('cfgPath').textContent = s.config_path;
  drawPill();
}

// ---- API key ----
async function saveKey() {
  const key = $('key').value.trim();
  const msg = $('keyMsg'); msg.className = 'msg'; msg.textContent = '…';
  $('saveKey').disabled = true;
  try {
    const r = await api('/api/test', { api_key: key });
    if (!r.ok) { msg.className = 'msg bad'; msg.textContent = r.message; return; }
    if (key) { S = await api('/api/config', { api_key: key }); $('key').value = ''; render(S); }
    msg.className = 'msg ok'; msg.textContent = t('keyOk');
  } catch (e) { msg.className = 'msg bad'; msg.textContent = e.message; }
  finally { $('saveKey').disabled = false; }
}
$('saveKey').onclick = saveKey;
$('key').addEventListener('keydown', e => { if (e.key === 'Enter') saveKey(); });

// ---- simple fields ----
for (const id of ['base_url', 'model', 'prompt']) $(id).addEventListener('change', () => save({ [id]: $(id).value }));
for (const id of ['min_hold', 'timeout']) $(id).addEventListener('change', () => save({ [id]: parseFloat($(id).value) }));
for (const id of ['sounds', 'auto_update', 'local_fallback']) $(id).addEventListener('change', () => save({ [id]: $(id).checked }));
$('language').addEventListener('change', () => save({ language: $('language').value }));

// ---- hotkey recorder ----
let recording = false;
const pretty = hk => hk.split('+').map(p => ({ alt: navigator.platform.startsWith('Mac') ? 'Option' : 'Alt', ctrl: 'Ctrl', shift: 'Shift', super: navigator.platform.startsWith('Mac') ? 'Cmd' : 'Win', space: 'Space' }[p] || p.toUpperCase())).join(' + ');
function stopRec() { recording = false; $('hotkey').classList.remove('rec'); $('recKey').disabled = false; $('hotkeyMsg').textContent = ''; render(S); }
$('recKey').onclick = () => {
  recording = true; $('hotkey').classList.add('rec'); $('hotkey').textContent = t('press'); $('recKey').disabled = true;
  $('hotkeyMsg').className = 'msg'; $('hotkeyMsg').textContent = t('hotkeyHint');
};
window.addEventListener('keydown', e => {
  if (!recording) return;
  e.preventDefault();
  if (e.key === 'Escape') return stopRec();
  const mods = [e.altKey && 'alt', e.ctrlKey && 'ctrl', e.shiftKey && 'shift', e.metaKey && 'super'].filter(Boolean);
  let key = null;
  if (e.code === 'Space') key = 'space';
  else if (/^Key[A-Z]$/.test(e.code)) key = e.code.slice(3).toLowerCase();
  else if (/^Digit\d$/.test(e.code)) key = e.code.slice(5);
  else if (/^F([1-9]|1[0-2])$/.test(e.code)) key = e.code.toLowerCase();
  if (!key) { $('hotkey').textContent = mods.length ? pretty(mods.join('+')) + ' + …' : t('press'); return; }
  const hk = [...mods, key].join('+');
  recording = false; $('hotkey').classList.remove('rec'); $('recKey').disabled = false; $('hotkeyMsg').textContent = '';
  save({ hotkey: hk });
}, true);

// ---- recording pill preview ----
// the same halftone bars as overlay.qml: 3 dot columns per bar, dense core, finer tips
const CELL = 2.5, DOT = 2.1, N = Math.floor(192 / (CELL * 4)) | 1, ROWS = Math.floor(40 / CELL), MID = (N - 1) / 2;
$('pill').innerHTML = '<canvas width="384" height="80"></canvas>';
const cv = $('pill').firstChild, ctx = cv.getContext('2d');
let dotColor = '#6b80ff';
const heights = new Array(N).fill(0.4);
function drawPill() {
  if (!S) return;
  const c = S.config, pill = $('pill');
  pill.style.background = c.overlay_bg;
  pill.style.setProperty('--s', c.overlay_size * 0.9);
  pill.style.top = c.overlay_position === 'top' ? '24px' : 'auto';
  pill.style.bottom = c.overlay_position === 'top' ? 'auto' : '24px';
  dotColor = c.overlay_bars; paintPill();
}
function paintPill() {
  ctx.setTransform(2, 0, 0, 2, 0, 0); ctx.clearRect(0, 0, 192, 40);
  ctx.fillStyle = dotColor; ctx.beginPath();
  const maxH = ROWS / 2 - 1, x0 = (192 - N * 4 * CELL + CELL) / 2, y0 = (40 - ROWS * CELL) / 2;
  for (let i = 0; i < N; i++) {
    const h = Math.max(1, heights[i] * maxH), cx = x0 + i * 4 * CELL;
    for (let r = 0; r < ROWS; r++) {
      const y = Math.abs(r + 0.5 - ROWS / 2);
      if (y > h + 0.5) continue;
      const sz = DOT * (0.45 + 0.55 * (1 - Math.pow(y / (h + 0.5), 1.4) * 0.85)), off = (CELL - sz) / 2;
      for (let k = 0; k < 3; k++) ctx.rect(cx + k * CELL + off, y0 + r * CELL + off, sz, sz);
    }
  }
  ctx.fill();
}
function frame(now) {
  requestAnimationFrame(frame);
  const tt = now / 1000;
  const env = 0.35 + 0.3 * Math.sin(tt * 2.1) * Math.sin(tt * 3.7) + 0.2 * Math.sin(tt * 7.3);
  for (let i = 0; i < N; i++) {
    const d = Math.abs(i - MID), taper = 1 - Math.pow(d / MID, 2) * 0.7;
    const v = Math.min(1, Math.max(0, 2.4 * env * taper * (0.78 + 0.22 * Math.sin(tt * 9 + i * 1.7)) * (0.7 + 0.3 * Math.sin(tt * 2 - d * 0.5))));
    heights[i] += (0.035 + v * 0.97 - heights[i]) * 0.25;
  }
  paintPill();
}
if (!matchMedia('(prefers-reduced-motion: reduce)').matches) requestAnimationFrame(frame); else paintPill();
for (const id of ['overlay_bg', 'overlay_bars']) {
  $(id).addEventListener('input', () => { S.config[id] = $(id).value; drawPill(); });
  $(id).addEventListener('change', () => save({ [id]: $(id).value }));
}
$('overlay_size').addEventListener('input', () => { S.config.overlay_size = parseFloat($('overlay_size').value); drawPill(); });
$('overlay_size').addEventListener('change', () => save({ overlay_size: parseFloat($('overlay_size').value) }));
document.querySelectorAll('#overlay_position button').forEach(b => b.onclick = () => save({ overlay_position: b.dataset.v }));
$('resetLook').onclick = () => save({ overlay_bg: '#0a0a0b', overlay_bars: '#6b80ff', overlay_position: 'bottom', overlay_size: 1 });

// ---- updates and service ----
$('checkUpd').onclick = async () => { $('checkUpd').disabled = true; try { S = await api('/api/update/check', {}); render(S); } finally { $('checkUpd').disabled = false; } };
$('installUpd').onclick = async () => { S = await api('/api/update/install', {}); render(S); const m = $('updMsg'); m.className = 'msg'; m.textContent = t('installing'); };
$('startSvc').onclick = async () => { $('startSvc').disabled = true; try { const r = await api('/api/service', {}); toast(r.message); } catch (e) { toast(e.message, true); } finally { $('startSvc').disabled = false; } };

applyLang();
setTimeout(() => document.body.classList.add('ready'), 300);
if (!S) api('/api/state').then(s => { S = s; render(s); }).catch(e => toast(e.message, true));
</script>
</body>
</html>
