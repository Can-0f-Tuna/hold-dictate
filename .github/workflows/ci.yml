name: CI
on: [push, pull_request]
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ matrix.python }}" }
      - name: Linux audio library
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libportaudio2
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q
      - name: Keyboard library loads (Windows, macOS)
        if: runner.os != 'Linux'
        run: python -c "import hold_dictate.hotkey as h; assert h.PynputBackend().usable()"
      - run: python -m hold_dictate --version
