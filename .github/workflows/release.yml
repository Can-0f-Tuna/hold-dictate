name: Release
# Push a tag such as v0.3.0 (matching __version__) and every installed copy updates within a day.
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches the version in the code
        run: |
          code=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' src/hold_dictate/__init__.py)
          test "v$code" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME but __version__ is $code"; exit 1; }
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - run: sudo apt-get update && sudo apt-get install -y libportaudio2
      - run: python -m pip install -e ".[dev]" && python -m pytest -q
      - run: gh release create "$GITHUB_REF_NAME" --generate-notes --title "$GITHUB_REF_NAME"
        env:
          GH_TOKEN: ${{ github.token }}
